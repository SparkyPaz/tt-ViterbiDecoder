  title: "Tiny Tapeout - Proyecto" # Project title
  author: "Rodrigo Poce" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Gate-Level Design and Simulation of an 8-State Viterbi Decoder" # One line description of what your project does
